apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  KAFKA_BROKERS: kafka:9092
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379
  ORDER_SERVICE_URL: http://order-service:3001
  INVENTORY_SERVICE_URL: http://inventory-service:3002
  PAYMENT_SERVICE_URL: http://payment-service:3003
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW_MS: "60000"
  PAYMENT_LIMIT_CENTS: "500000"
---
# Local-cluster credentials only. Use a real secret store outside a demo.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  ORDERS_DATABASE_URL: postgres://postgres:postgres@orders-db:5432/orders
  INVENTORY_DATABASE_URL: postgres://postgres:postgres@inventory-db:5432/inventory
  PAYMENTS_DATABASE_URL: postgres://postgres:postgres@payments-db:5432/payments
