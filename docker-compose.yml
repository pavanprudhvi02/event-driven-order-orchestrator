name: order-orchestrator

x-service: &service
  build:
    context: .
  restart: on-failure
  environment: &service-env
    KAFKA_BROKERS: kafka:9092
    LOG_LEVEL: info
  depends_on: &service-deps
    kafka:
      condition: service_healthy

x-postgres: &postgres
  image: postgres:16-alpine
  environment: &pg-env
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: oLHzXPBzTWiH0sR8fbVwnA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  orders-db:
    <<: *postgres
    environment:
      <<: *pg-env
      POSTGRES_DB: orders
    volumes:
      - orders-data:/var/lib/postgresql/data

  inventory-db:
    <<: *postgres
    environment:
      <<: *pg-env
      POSTGRES_DB: inventory
    volumes:
      - inventory-data:/var/lib/postgresql/data

  payments-db:
    <<: *postgres
    environment:
      <<: *pg-env
      POSTGRES_DB: payments
    volumes:
      - payments-data:/var/lib/postgresql/data

  order-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: order-service }
    environment:
      <<: *service-env
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@orders-db:5432/orders
    depends_on:
      <<: *service-deps
      orders-db:
        condition: service_healthy
    healthcheck: &http-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventory-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: inventory-service }
    environment:
      <<: *service-env
      PORT: 3002
      DATABASE_URL: postgres://postgres:postgres@inventory-db:5432/inventory
    depends_on:
      <<: *service-deps
      inventory-db:
        condition: service_healthy
    healthcheck: *http-health

  payment-service:
    <<: *service
    build:
      context: .
      args: { SERVICE: payment-service }
    environment:
      <<: *service-env
      PORT: 3003
      DATABASE_URL: postgres://postgres:postgres@payments-db:5432/payments
      PAYMENT_LIMIT_CENTS: 500000
    depends_on:
      <<: *service-deps
      payments-db:
        condition: service_healthy
    healthcheck: *http-health

  api-gateway:
    build:
      context: .
      args: { SERVICE: api-gateway }
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      ORDER_SERVICE_URL: http://order-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3003
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_MS: 60000
    depends_on:
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck: *http-health

volumes:
  orders-data:
  inventory-data:
  payments-data:
